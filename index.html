<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background:linear-gradient(135deg,#111,#333);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background:rgba(255,255,255,.08);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            width: 320px;
            box-shadow: 0 10px 30px rgba(0,0,0,.4);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255,255,255,.2);
            font-size: 18px;
        }

        .item:last-child {
            border-bottom: none;
        }

        .time {
            font-weight: bold;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            opacity: .8;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1> Расписание</h1>

    <div class="item">
        <span>Четверг</span>
        <span class="time">19:00</span>
    </div>

    <div class="item">
        <span>Суббота</span>
        <span class="time">19:00</span>
    </div>

    <div class="item">
        <span>Воскресенье</span>
        <span class="time">16:00</span>
    </div>

    <footer>
        До встречи!
    </footer>
</div>

</body>
</html>
