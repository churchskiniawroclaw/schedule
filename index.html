<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Расписание</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#111,#333);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.card{
    width:90%;
    max-width:420px;
    background:rgba(255,255,255,.08);
    border-radius:24px;
    padding:40px 30px;
    text-align:center;
    backdrop-filter:blur(10px);
    box-shadow:0 15px 40px rgba(0,0,0,.4);
}

h1{
    margin-bottom:10px;
}

p{
    color:#ddd;
    margin-bottom:30px;
}

.item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 20px;
    margin:15px 0;
    border-radius:15px;
    background:#ffffff20;
    transition:.3s;
}

.item:hover{
    background:white;
    color:#111;
}

.left{
    text-align:left;
}

.day{
    font-size:18px;
    font-weight:bold;
}

.event{
    font-size:14px;
    opacity:.8;
}

.time{
    font-size:22px;
    font-weight:bold;
}

.footer{
    margin-top:30px;
    color:#bbb;
    font-size:14px;
}
</style>

</head>
<body>

<div class="card">

<h1>Расписание</h1>
<p>Skinia Wrocław</p>

<div class="item">
    <div class="left">
        <div class="day">Четверг</div>
        <div class="event">Домажка</div>
    </div>
    <div class="time">19:00</div>
</div>

<div class="item">
    <div class="left">
        <div class="day">Суббота</div>
        <div class="event">Молодёжка</div>
    </div>
    <div class="time">19:00</div>
</div>

<div class="item">
    <div class="left">
        <div class="day">Воскресенье</div>
        <div class="event">Собрание</div>
    </div>
    <div class="time">16:00</div>
</div>

<div class="footer">
© Skinia Wrocław
</div>

</div>

</body>
</html>
